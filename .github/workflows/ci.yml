# Orbit CI — push / PR 시 자동 검사 (테스트·린트·타입체크)
# 배포(CD)는 Vercel/Railway 가 담당하므로 여기서는 검사만 한다.
name: CI

on:
  push:
    branches: ["**"] # 모든 브랜치 push
  pull_request: # 모든 PR

# 같은 브랜치에서 새 커밋을 밀면 진행 중이던 이전 실행은 취소해 낭비를 줄인다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 셋업 (+ pip 캐시)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 린트 (ruff)
        run: ruff check .

      - name: 테스트 (pytest)
        run: pytest -q

  frontend:
    name: 프론트 (eslint · tsc · vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 20 셋업 (+ npm 캐시)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크 (tsc)
        run: npx tsc --noEmit

      - name: 린트 (eslint)
        run: npm run lint

      - name: 테스트 (vitest)
        run: npm test
